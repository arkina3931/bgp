<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}桌游助手{% endblock %}</title>
    <link href="/static/common.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <meta name="theme-color" content="#1d1d1f" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="桌游助手">
    <script src="/static/common.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="top-nav-inner">
            <div class="top-nav-left">
                {% block nav_left %}{% endblock %}
            </div>
            <span class="top-nav-title">{% block nav_title %}🎲 桌游助手{% endblock %}</span>
            <div class="top-nav-right">
                {% block nav_right %}{% endblock %}
            </div>
        </div>
    </nav>

    <!-- Content -->
    {% block content %}{% endblock %}

    <!-- Bottom Tab Bar (main pages only, overridden by game pages) -->
    {% block show_tab_bar %}
    <nav class="tab-bar">
        <a href="/" class="tab-bar-item{% if request.url.path == '/' %} active{% endif %}">
            <span class="tab-icon">🏠</span>
            <span class="tab-label">首页</span>
        </a>
        <a href="/gamelist" class="tab-bar-item{% if request.url.path == '/gamelist' %} active{% endif %}">
            <span class="tab-icon">🎮</span>
            <span class="tab-label">游戏</span>
        </a>
        <a href="/#leaderboard" class="tab-bar-item">
            <span class="tab-icon">🏆</span>
            <span class="tab-label">排行</span>
        </a>
    </nav>
    {% endblock %}

    <!-- PWA Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').catch(function () {});
        }
    </script>
    {% block extra_body %}{% endblock %}
</body>
</html>
