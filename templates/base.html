<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}桌游助手{% endblock %}</title>
    <link href="/static/common.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <meta name="theme-color" content="#1d1d1f" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="桌游助手">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <script src="/static/common.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="top-nav-inner">
            <div class="top-nav-left">
                {% block nav_left %}{% endblock %}
            </div>
            <span class="top-nav-title">{% block nav_title %}🎲 桌游助手{% endblock %}</span>
            <div class="top-nav-right">
                {% block nav_right %}{% endblock %}
            </div>
        </div>
    </nav>

    <!-- Content -->
    {% block content %}{% endblock %}

    <!-- Bottom Tab Bar (main pages only, overridden by game pages) -->
    {% block show_tab_bar %}
    <nav class="tab-bar" id="bottomTabBar">
        <a href="/" class="tab-bar-item" data-path="/">
            <span class="tab-icon">
                <i class="ph ph-house" data-active-class="ph-fill ph-house"></i>
            </span>
            <span class="tab-label">首页</span>
        </a>
        <a href="/gamelist" class="tab-bar-item" data-path="/gamelist">
            <span class="tab-icon">
                <i class="ph ph-game-controller" data-active-class="ph-fill ph-game-controller"></i>
            </span>
            <span class="tab-label">游戏</span>
        </a>
        <a href="/#leaderboard" class="tab-bar-item" data-path="/#leaderboard">
            <span class="tab-icon">
                <i class="ph ph-trophy" data-active-class="ph-fill ph-trophy"></i>
            </span>
            <span class="tab-label">排行</span>
        </a>
    </nav>
    {% endblock %}

    <!-- PWA Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').catch(function () {});
        }
    </script>

    <!-- Tab Bar State Manager -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var tabBar = document.getElementById('bottomTabBar');
            if (!tabBar) return;
            
            function updateActiveTab() {
                var path = window.location.pathname;
                var hash = window.location.hash;
                var items = tabBar.querySelectorAll('.tab-bar-item');
                
                items.forEach(function(item) {
                    var itemPath = item.getAttribute('data-path');
                    var isActive = false;
                    
                    if (itemPath === '/#leaderboard') {
                        isActive = (hash === '#leaderboard');
                    } else if (itemPath === '/') {
                        isActive = (path === '/' && hash !== '#leaderboard');
                    } else {
                        isActive = (path === itemPath);
                    }
                    
                    var icon = item.querySelector('i');
                    if (isActive) {
                        item.classList.add('active');
                        if (icon) {
                            var activeClass = icon.getAttribute('data-active-class');
                            if (activeClass) icon.className = activeClass;
                        }
                    } else {
                        item.classList.remove('active');
                        if (icon) {
                            var activeClass = icon.getAttribute('data-active-class');
                            if (activeClass) {
                                var inactiveClass = activeClass.replace('ph-fill', 'ph');
                                icon.className = inactiveClass;
                            }
                        }
                    }
                });
            }
            
            updateActiveTab();
            window.addEventListener('hashchange', updateActiveTab);
            
            // Listen for clicks on the leaderboard tab to scroll smoothly
            var rankTab = tabBar.querySelector('a[data-path="/#leaderboard"]');
            if (rankTab) {
                rankTab.addEventListener('click', function() {
                    if (window.location.pathname === '/' && window.location.hash === '#leaderboard') {
                        var lb = document.getElementById('leaderboard');
                        if (lb) lb.scrollIntoView({ behavior: 'smooth' });
                    }
                });
            }
        });
    </script>
    {% block extra_body %}{% endblock %}
</body>
</html>
