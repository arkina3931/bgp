{% extends "base.html" %}

{% block title %}游戏列表 - 桌游助手{% endblock %}

{% block nav_title %}🎮 游戏列表{% endblock %}

{% block tab_games_active %}active{% endblock %}

{% block extra_head %}
<style>
    .game-cards-container {
        padding: 0 var(--space-md);
        margin-bottom: var(--space-2xl);
    }

    .game-detail-card.hidden {
        display: none !important;
    }

    .gd-icon {
        color: #fff;
    }

    .gd-name {
        font-size: 1.1rem;
        font-weight: 700;
        margin: 0;
    }

    .gd-en-name {
        font-size: 0.8rem;
        color: var(--color-text-secondary);
        font-weight: 500;
    }

    .gd-rating {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 0.85rem;
        font-weight: 600;
    }

    .gd-star {
        color: var(--color-yellow);
    }

    .gd-rating-num {
        color: var(--color-text-secondary);
        font-size: 0.8rem;
        margin-left: 4px;
    }

    .gd-header .rules-btn {
        flex-shrink: 0;
        background: rgba(0, 0, 0, 0.06);
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1rem;
        color: var(--color-text-secondary);
        transition: background var(--transition-fast);
        font-family: var(--font-stack);
    }

    .gd-header .rules-btn:hover {
        background: rgba(0, 0, 0, 0.12);
    }

    .gd-btn-row {
        margin-top: var(--space-md);
    }

    .sheet-tab-bar {
        display: flex;
        gap: 8px;
        margin: 0 var(--space-lg) var(--space-md);
        padding: 4px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.04);
    }

    .sheet-tab-btn {
        flex: 1;
        min-height: 36px;
        border: none;
        border-radius: 10px;
        background: transparent;
        color: var(--color-text-secondary);
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition-fast);
        font-family: var(--font-stack);
    }

    .sheet-tab-btn:hover {
        background: rgba(0, 0, 0, 0.04);
        color: var(--color-text);
    }

    .sheet-tab-btn.active {
        background: var(--color-surface);
        color: var(--color-blue);
        box-shadow: var(--shadow-sm);
    }

    .sheet-body {
        padding: 0 var(--space-lg);
        overflow-y: auto;
        flex: 1;
    }

    .sheet-body h4 {
        margin: var(--space-md) 0 var(--space-sm);
        font-size: 1rem;
        color: var(--color-text);
    }

    .sheet-body p {
        margin: 0 0 12px;
        color: var(--color-desc);
        font-size: 0.9rem;
        line-height: 1.6;
    }

    .sheet-body ul {
        margin: 4px 0 var(--space-md);
        padding-left: 1.2rem;
    }

    .sheet-body li {
        margin-bottom: 6px;
        color: var(--color-desc);
        font-size: 0.9rem;
        line-height: 1.55;
    }

    .sheet-body strong {
        color: var(--color-text);
        font-weight: 600;
    }

    .sheet-close-btn {
        padding: var(--space-md) var(--space-lg);
        border-top: 1px solid var(--color-border);
        flex-shrink: 0;
    }
</style>
{% endblock %}

{% block content %}
<!-- Filter Chips -->
<div class="filter-scroll" id="filterScroll">
    <button class="filter-chip active" data-players="0" onclick="handleFilterClick(this)">全部</button>
    <button class="filter-chip" data-players="2" onclick="handleFilterClick(this)">2人</button>
    <button class="filter-chip" data-players="3" onclick="handleFilterClick(this)">3人</button>
    <button class="filter-chip" data-players="4" onclick="handleFilterClick(this)">4人</button>
    <button class="filter-chip" data-players="5" onclick="handleFilterClick(this)">5人</button>
    <button class="filter-chip" data-players="6" onclick="handleFilterClick(this)">6人</button>
    <button class="filter-chip" data-players="7" onclick="handleFilterClick(this)">7人</button>
    <button class="filter-chip" data-players="8" onclick="handleFilterClick(this)">8人</button>
    <button class="filter-chip" data-players="9" onclick="handleFilterClick(this)">9人+</button>
</div>

<!-- Game Cards Container (JS-rendered) -->
<div class="game-cards-container" id="gameCardsContainer"></div>

<!-- Rules Bottom Sheet -->
<div class="sheet-overlay" id="rulesSheet" onclick="if(event.target === this) closeRules()">
    <div class="sheet-content">
        <div class="sheet-handle"></div>
        <div class="modal-header" style="border-bottom: none; padding-bottom: 0;">
            <h2 class="modal-title" id="sheetTitle">📖 规则</h2>
            <button class="modal-close" onclick="closeRules()">
                <i class="ph-bold ph-x"></i>
            </button>
        </div>
        <div class="sheet-tab-bar">
            <button id="sheetRuleBtn" class="sheet-tab-btn active" onclick="switchRulesTab('rule')">📋 规则</button>
            <button id="sheetGuideBtn" class="sheet-tab-btn" onclick="switchRulesTab('guide')">💡 攻略</button>
        </div>
        <div class="sheet-body" id="sheetContent"></div>
        <div class="sheet-close-btn">
            <button class="btn btn-secondary btn-block" onclick="closeRules()">关闭</button>
        </div>
    </div>
</div>
{% endblock %}

// ============================================
// Color mapping helper
// ============================================
function colorBg(c) {
    var map = {
        purple: 'rgba(175,82,222,0.18)',
        blue: 'rgba(0,113,227,0.18)',
        green: 'rgba(52,199,89,0.18)',
        red: 'rgba(255,59,48,0.18)',
        orange: 'rgba(255,149,0,0.18)'
    };
    return map[c] || 'rgba(0,0,0,0.08)';
}

// ============================================
// Star rating HTML
// ============================================
function starsHtml(rating) {
    var n = parseFloat(rating) || 0;
    var full = Math.floor(n);
    var half = (n - full) >= 0.5 ? 1 : 0;
    var empty = 5 - full - half;
    var html = '';
    for (var i = 0; i < full; i++) { html += '★'; }
    if (half) { html += '☆'; }
    for (var i = 0; i < empty; i++) { html += '☆'; }
    return html;
}

// ============================================
// Render game cards
// ============================================
function renderGameCards(filterPlayers) {
    if (typeof filterPlayers === 'undefined') { filterPlayers = 0; }
    var container = document.getElementById('gameCardsContainer');
    if (!container) return;

    var html = '';
    for (var i = 0; i < GAMES.length; i++) {
        var g = GAMES[i];
        var show = true;
        if (filterPlayers === 9) {
            show = g.maxP >= 9;
        } else if (filterPlayers > 0) {
            show = filterPlayers >= g.minP && filterPlayers <= g.maxP;
        }

        if (!show) continue;

        var tagsHtml = '';
        for (var t = 0; t < g.tags.length; t++) {
            tagsHtml += '<span class="tag tag-mech">' + escHtml(g.tags[t]) + '</span>';
        }

        html += '<div class="game-detail-card" data-min="' + g.minP + '" data-max="' + g.maxP + '">';
        html += '  <div class="gd-header">';
        html += '    <div class="gd-icon" style="background:' + colorBg(g.color) + '">' + g.icon + '</div>';
        html += '    <div class="flex-1">';
        html += '      <div class="gd-name">' + escHtml(g.name) + '</div>';
        html += '      <div class="gd-en-name">' + escHtml(g.enName) + '</div>';
        html += '      <div class="gd-rating">';
        html += '        <span class="gd-star">' + starsHtml(g.rating) + '</span>';
        html += '        <span class="gd-rating-num">' + escHtml(g.rating) + '</span>';
        html += '      </div>';
        html += '    </div>';
        html += '    <button class="rules-btn" onclick="openRules(\'' + g.id + '\', event)" title="规则">📖</button>';
        html += '  </div>';
        html += '  <div class="gd-stats">';
        html += '    <div class="gd-stat">👥 推荐 ' + escHtml(g.recP) + '人</div>';
        html += '    <div class="gd-stat">⏱ ' + escHtml(g.duration) + '</div>';
        html += '    <div class="gd-stat">🎂 ' + escHtml(g.age) + '</div>';
        html += '    <div class="gd-stat">📊 ' + escHtml(g.difficulty) + '</div>';
        html += '  </div>';
        html += '  <div class="gd-desc">' + escHtml(g.desc) + '</div>';
        html += '  <div class="gd-tags">' + tagsHtml + '</div>';
        html += '  <div class="gd-btn-row">';
        html += '    <a href="' + g.href + '" class="btn btn-primary btn-block">进入游戏</a>';
        html += '  </div>';
        html += '</div>';
    }

    container.innerHTML = html;
}

// ============================================
// Filter chip click handler
// ============================================
function handleFilterClick(chip) {
    var scroll = document.getElementById('filterScroll');
    if (!scroll) return;
    var chips = scroll.querySelectorAll('.filter-chip');
    for (var i = 0; i < chips.length; i++) {
        chips[i].classList.remove('active');
    }
    chip.classList.add('active');
    var players = parseInt(chip.getAttribute('data-players')) || 0;
    renderGameCards(players);
}

// ============================================
// Rules sheet state
// ============================================
var currentGameId = null;
var currentTab = 'rule';

// ============================================
// Open rules sheet for a game
// ============================================
function openRules(gameId, event) {
    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }

    // Find game
    var game = null;
    for (var i = 0; i < GAMES.length; i++) {
        if (GAMES[i].id === gameId) { game = GAMES[i]; break; }
    }
    if (!game) return;

    currentGameId = gameId;
    currentTab = 'rule';

    document.getElementById('sheetTitle').textContent = '📖 ' + game.name;
    updateRulesContent();

    document.getElementById('rulesSheet').classList.add('show');
}

// ============================================
// Close rules sheet
// ============================================
function closeRules() {
    document.getElementById('rulesSheet').classList.remove('show');
}

// ============================================
// Switch between rule/guide tabs
// ============================================
function switchRulesTab(tab) {
    currentTab = tab;
    var ruleBtn = document.getElementById('sheetRuleBtn');
    var guideBtn = document.getElementById('sheetGuideBtn');

    if (ruleBtn && guideBtn) {
        ruleBtn.classList.toggle('active', tab === 'rule');
        guideBtn.classList.toggle('active', tab === 'guide');
    }

    updateRulesContent();
}

// ============================================
// Update rules content based on current game + tab
// ============================================
function updateRulesContent() {
    if (!currentGameId) return;

    var game = null;
    for (var i = 0; i < GAMES.length; i++) {
        if (GAMES[i].id === currentGameId) { game = GAMES[i]; break; }
    }
    if (!game) return;

    var content = currentTab === 'rule' ? game.rule : game.guide;
    document.getElementById('sheetContent').innerHTML = content || '<p>暂无内容</p>';
}

// ============================================
// Initial render
// ============================================
renderGameCards(0);
</script>
{% endblock %}
